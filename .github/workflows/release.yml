name: Release

# Publishes to npm via Trusted Publishing (OIDC) when a GitHub Release is published.
# No NPM_TOKEN secret is needed — instead, configure a Trusted Publisher on npmjs.com
# for this repository and this workflow file (.github/workflows/release.yml).
# Create a release whose tag matches the package.json version (e.g. v1.1.0).
# workflow_dispatch is available for testing the OIDC publish pipeline.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted Publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Diagnostics
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "OIDC id-token URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"

      - run: npm ci

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Trusted Publishing: npm exchanges the OIDC token automatically and
      # generates provenance — no token, no --provenance flag required.
      - run: npm publish
